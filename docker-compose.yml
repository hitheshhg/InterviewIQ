version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interviewiq-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000
      - ENVIRONMENT=production
    restart: unless-stopped
    networks:
      - interviewiq-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: interviewiq-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - interviewiq-net

networks:
  interviewiq-net:
    driver: bridge
